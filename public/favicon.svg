<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="NumeriCore">
  <rect width="32" height="32" rx="7" fill="#07140d"/>
  <!-- trapezoid strips approximating the area under a rising curve -->
  <g fill="#4ade80">
    <path d="M6 24 L6 20 L11 15 L11 24 Z" opacity="0.35"/>
    <path d="M11 24 L11 15 L16 11 L16 24 Z" opacity="0.5"/>
    <path d="M16 24 L16 11 L21 8 L21 24 Z" opacity="0.65"/>
    <path d="M21 24 L21 8 L26 6 L26 24 Z" opacity="0.8"/>
  </g>
  <!-- the curve itself -->
  <path d="M6 20 L11 15 L16 11 L21 8 L26 6" fill="none" stroke="#4ade80"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- sample points -->
  <g fill="#bbf7d0">
    <circle cx="6" cy="20" r="1.3"/>
    <circle cx="16" cy="11" r="1.3"/>
    <circle cx="26" cy="6" r="1.3"/>
  </g>
  <!-- baseline axis -->
  <path d="M5 24 H27" stroke="#1f3a2a" stroke-width="1.6" stroke-linecap="round"/>
</svg>
